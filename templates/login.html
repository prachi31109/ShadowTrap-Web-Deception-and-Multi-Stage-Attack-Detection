<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShadowMart — Admin Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">
    <div class="container navbar-inner">

        <div class="brand">
            <div class="brand-mark">S</div>

            <div>
                <div class="brand-name">ShadowMart</div>
                <div class="brand-subtitle">Operations Console</div>
            </div>
        </div>

        <div class="badge badge-green">
            Secure Portal
        </div>

    </div>
</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">🔐</div>

        <h1>Backup Administration</h1>

        <p class="muted">
            Sign in to access backup management and system
            administration resources.
        </p>

        <form method="POST" action="/admin-backup/login">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your username"
                    autocomplete="off"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="off"
                    required>
            </div>

            <button class="btn" type="submit">
                Continue to Console
            </button>

        </form>

        <div class="auth-meta">
            ShadowMart Internal Operations · Authorized Personnel Only
        </div>

    </div>

</main>

</body>
</html>
